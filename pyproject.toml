[project]
name = "claimcontext"
version = "0.1.0"
description = "Grounded, cited Q&A assistant for insurance claim adjusters"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "mypy==2.3.0",
    "ruff==0.15.22",
    "black==26.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claimcontext"]

[tool.ruff]
line-length = 100
src = ["src", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"scripts/clause_library.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["claimcontext"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = false
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["claimcontext"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
