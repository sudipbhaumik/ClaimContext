[project]
name = "claimcontext"
version = "0.1.0"
description = "Grounded, cited Q&A assistant for insurance claim adjusters"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
    "pymupdf==1.28.0",
    "tiktoken==0.13.0",
    "sentence-transformers==5.6.0",
    "qdrant-client==1.18.0",
    "tenacity==9.1.4",
    "ollama==0.6.2",
    "anthropic==0.120.2",
    "openai==2.50.0",
    "rank-bm25==0.2.2",
    "ragas==0.4.3",
    "langchain-community>=0.3",
    "langgraph>=1.2.10",
    "langchain-core>=1.5.2",
    "mcp>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "mypy==2.3.0",
    "ruff==0.15.22",
    "black==26.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claimcontext"]

[tool.ruff]
line-length = 100
src = ["src", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"scripts/clause_library.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["claimcontext"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = false
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["claimcontext"]

[[tool.mypy.overrides]]
module = "rank_bm25"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["ragas", "ragas.*", "instructor", "langchain_community.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
markers = [
    "retrieval: live Qdrant + optional Ollama proofs (spec-2a)",
    "eval: live eval harness proofs — requires Qdrant, Ollama, and OPENAI_API_KEY (spec-4)",
    "agent: live agent orchestrator proofs — requires Qdrant + Ollama (spec-5a)",
    "agent_eval: live trajectory eval proofs — requires Qdrant + Ollama (spec-6)",
]

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "pytest==9.1.1",
    "ruff==0.15.22",
]
